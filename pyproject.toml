[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-guardian"
version = "0.1.0"
description = "Provider-neutral evaluation, red-teaming, and release gates for production LLM systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ali Mattar" }]
dependencies = [
  "PyYAML>=6.0.1",
  "typer>=0.12.3",
  "rich>=13.7.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dashboard = ["streamlit>=1.38", "pandas>=2.2", "plotly>=5.24"]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.34"]
dev = [
  "pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11",
  "httpx>=0.27", "types-PyYAML>=6.0",
]
all = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30",
  "streamlit>=1.38", "pandas>=2.2", "plotly>=5.24",
  "openai>=1.50", "anthropic>=0.34",
]

[project.scripts]
llm-guardian = "llm_guardian.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["llm_guardian"]
