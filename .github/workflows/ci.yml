name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,api]"
      - run: ruff check .
      - run: mypy src/llm_guardian
      - run: pytest --cov=llm_guardian --cov-report=term-missing --cov-fail-under=80
      - name: Reproduce release gate
        run: python scripts/run_demo.py --check-clean
